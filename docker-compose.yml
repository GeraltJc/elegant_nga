services:
  nginx:
    image: nginx:1.25-alpine
    depends_on:
      php:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: ./docker/php
      args:
        TZ: "${TZ:-Asia/Shanghai}"
    image: elegant_nga-php
    depends_on:
      mysql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend:/var/www/backend

  scheduler:
    image: elegant_nga-php
    depends_on:
      - mysql
      - elasticsearch
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./backend:/var/www/backend
    command: ["php", "artisan", "schedule:work"]

  frontend:
    build:
      context: ./docker/frontend
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      VITE_DEV_PORT: "${FRONTEND_PORT:-5173}"
      VITE_PROXY_TARGET: "http://nginx"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/var/www/frontend
      - frontend_node_modules:/var/www/frontend/node_modules
    command: ["sh", "/usr/local/bin/entrypoint.sh"]

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-elegant_nga}"
      MYSQL_USER: "${MYSQL_USER:-elegant_nga}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-elegant_nga}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "${KIBANA_PORT:-5601}:5601"

volumes:
  mysql_data:
  frontend_node_modules:
  elasticsearch_data:
